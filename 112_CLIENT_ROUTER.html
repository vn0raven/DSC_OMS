<script>

/******************************************************
 * CLIENT ROUTER
 *
 * Handles:
 * - Page navigation
 * - Active menu state
 * - Module loading
 ******************************************************/



/******************************************************
 * SHOW SECTION
 ******************************************************/

window.showSection = function(button, section){


console.log(
"========== ROUTER START =========="
);


console.log(
"TARGET SECTION:",
section
);


console.log(
"CLICK BUTTON:",
button
);





/*
 Hide all sections
*/


const sections = document.querySelectorAll(
".page-section"
);



console.log(
"SECTIONS FOUND:",
sections.length
);



sections.forEach(function(page){


if(page){

page.style.display = "none";

}


});






/*
 Show selected section
*/


const target = document.getElementById(
section
);



console.log(
"TARGET ELEMENT:",
target
);




if(target){


target.style.display = "block";


}
else{


console.error(
"SECTION NOT FOUND:",
section
);


return;


}







/*
 Remove active state
*/


const navItems = document.querySelectorAll(
".nav-item"
);



console.log(
"NAV ITEMS FOUND:",
navItems.length
);




navItems.forEach(function(item){


if(item){

item.classList.remove(
"active"
);

}


});








/*
 Add active state
*/


if(button){


button.classList.add(
"active"
);


}
else{


console.warn(
"No button provided"
);


}









/*
 Load module data when needed
*/


switch(section){



case "dashboard":



if(typeof renderDashboard === "function"){


console.log(
"Loading dashboard"
);


renderDashboard();



}
else{


console.warn(
"renderDashboard() missing"
);


}


break;







case "tasks":



if(typeof loadTasks === "function"){


console.log(
"Loading tasks"
);


loadTasks();



}
else{


console.warn(
"loadTasks() missing"
);


}


break;








case "requests":



if(typeof loadRequests === "function"){


console.log(
"Loading requests"
);


loadRequests();



}
else{


console.warn(
"loadRequests() missing"
);


}


break;








case "notifications":



if(typeof loadNotifications === "function"){


console.log(
"Loading notifications"
);


loadNotifications();



}
else{


console.warn(
"loadNotifications() missing"
);


}


break;




default:


console.warn(
"Unknown section:",
section
);


break;



}





console.log(
"========== ROUTER END =========="
);



};

</script>
