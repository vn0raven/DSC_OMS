<script>

/******************************************************
 * CLIENT ROUTER
 *
 * Handles:
 * - Page navigation
 * - Active menu state
 ******************************************************/



/******************************************************
 * SHOW SECTION
 ******************************************************/

window.showSection = function(
button,
section
){


console.log(
"ROUTER:",
section
);



/*
 Hide all sections
*/

document
.querySelectorAll(
".page-section"
)
.forEach(function(page){

page.style.display = "none";

});





/*
 Show selected section
*/

const target = document.getElementById(
section
);


if(target){

target.style.display = "block";

}






/*
 Remove active state
*/

document
.querySelectorAll(
".nav-item"
)
.forEach(function(item){

item.classList.remove(
"active"
);

});






/*
 Add active state safely
*/

if(button){

button.classList.add(
"active"
);

}








/*
 Load module data when needed
*/

switch(section){



case "dashboard":


if(
typeof renderDashboard === "function"
){

renderDashboard();

}


break;






case "tasks":


if(
typeof loadTasks === "function"
){

loadTasks();

}


break;






case "requests":


if(
typeof loadRequests === "function"
){

loadRequests();

}


break;






case "notifications":


if(
typeof loadNotifications === "function"
){

loadNotifications();

}


break;



}



};


</script>
