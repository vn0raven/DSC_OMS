<script>

/******************************************************
 * TASK MODULE V3
 *
 * Handles:
 * - Task table rendering
 * - Task status display
 * - Task navigation
 * - TASKS V2 DATABASE
 ******************************************************/



function renderTasks(tasks){


const table =
document.getElementById(
"taskTable"
);



if(!table){

console.warn(
"taskTable not found"
);

return;

}




if(!tasks || tasks.length === 0){


table.innerHTML = `

<tr>

<td colspan="7">

No tasks available.

</td>

</tr>

`;


return;

}





let html = "";




tasks.forEach(function(task){



const progress =

Number(
task[TASK_IDX.PROGRESS]
)

|| 0;





const status =

task[TASK_IDX.STATUS]

||

CLIENT_CONFIG.STATUS.ASSIGNED;





html += `


<tr>


<td>


<div class="task-title">

${escapeHTML(
task[TASK_IDX.TITLE] || ""
)}

</div>



<small>

${escapeHTML(
task[TASK_IDX.PROJECT] || ""
)}

</small>


</td>






<td>

${escapeHTML(
task[TASK_IDX.DEPARTMENT] || ""
)}

</td>






<td>


<span class="priority ${

String(
task[TASK_IDX.PRIORITY] || ""
)

.toLowerCase()

}">


${escapeHTML(

task[TASK_IDX.PRIORITY] || ""

)}



</span>


</td>







<td>


<div class="progress">


<div

class="progress-bar"

style="width:${progress}%">

</div>


</div>


<small>

${progress}%

</small>


</td>






<td>

${formatDate(

task[TASK_IDX.DEADLINE]

)}

</td>







<td>


<span class="status ${

getStatusClass(status)

}">


${escapeHTML(status)}


</span>


</td>







<td>


<button

class="view-btn"

onclick="viewTask('${

task[TASK_IDX.ID]

}')">


View


</button>


</td>





</tr>


`;



});





table.innerHTML = html;



}







/******************************************************
 * LOAD TASKS
 ******************************************************/


function loadTasks(){


renderTasks(

APP_STATE.tasks

);


}



</script>
