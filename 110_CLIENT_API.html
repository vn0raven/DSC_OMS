/******************************************************
 * CLIENT API SERVICE
 ******************************************************/



function serverCall(
functionName,
params=[],
success,
failure
){


google.script.run


.withSuccessHandler(function(response){


console.log(
"SERVER RESPONSE:",
response
);



if(success){

success(response);

}



})


.withFailureHandler(function(error){


console.error(
"SERVER ERROR:",
error
);



if(failure){

failure(error);

}



})


[functionName](...params);



}
