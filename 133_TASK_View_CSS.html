<style>

/******************************************************
 * TASK VIEW MINI UI SYSTEM
 *
 * Independent styling for:
 * - Task detail modal
 * - Task information cards
 * - Action buttons
 *
 * Edit colors/fonts here only.
 ******************************************************/



/* ==========================
   GLOBAL TASK VIEW SETTINGS
========================== */


:root{


/* MAIN COLORS */

--task-primary:#1f4e79;

--task-secondary:#64748b;

--task-background:#f8fafc;

--task-card:#ffffff;

--task-border:#e2e8f0;

--task-text:#1e293b;

--task-muted:#64748b;



/* STATUS COLORS */

--status-success:#16a34a;

--status-warning:#f59e0b;

--status-danger:#dc2626;



/* STYLE */

--task-radius:14px;

--task-shadow:
0 10px 30px rgba(0,0,0,0.12);



/* FONT */

--task-font:
"Inter",
"Segoe UI",
Arial,
sans-serif;


}





/******************************************************
 MODAL BACKGROUND
******************************************************/


.task-modal{


display:none;


position:fixed;


top:0;

left:0;


width:100%;

height:100%;



background:

rgba(15,23,42,0.55);



justify-content:center;

align-items:center;



z-index:999;



font-family:
var(--task-font);


}







/******************************************************
 MODAL BOX
******************************************************/


.task-modal-content{


width:600px;


max-width:90%;



background:
var(--task-card);



border-radius:
var(--task-radius);



box-shadow:
var(--task-shadow);



padding:25px;



color:
var(--task-text);


}







/******************************************************
 HEADER
******************************************************/


.task-header{


display:flex;


justify-content:space-between;


align-items:center;



margin-bottom:20px;


}



.task-header h2{


margin:0;


font-size:24px;


color:
var(--task-primary);


}



.task-id{


font-size:12px;


color:
var(--task-muted);


}







/******************************************************
 STATUS BADGE
******************************************************/


.status-badge{


padding:6px 14px;


border-radius:20px;


font-size:13px;


font-weight:600;


background:#e2e8f0;


}





.status-badge.success{


background:#dcfce7;


color:
var(--status-success);


}



.status-badge.warning{


background:#fef3c7;


color:
var(--status-warning);


}



.status-badge.pending{


background:#e0f2fe;


color:
var(--task-primary);


}



.status-badge.danger{


background:#fee2e2;


color:
var(--status-danger);


}








/******************************************************
 TASK INFORMATION GRID
******************************************************/


.task-grid{


display:grid;


grid-template-columns:

repeat(2,1fr);



gap:15px;


}







.task-card{


background:
var(--task-background);



border:

1px solid var(--task-border);



border-radius:

12px;



padding:15px;


}





.task-card label{


display:block;


font-size:12px;


color:
var(--task-muted);



margin-bottom:5px;


}





.task-card p{


margin:0;


font-size:15px;


font-weight:600;


}








/******************************************************
 NOTES SECTION
******************************************************/


.task-section{


margin-top:20px;


}



.task-section h3{


font-size:16px;


margin-bottom:8px;


}





.task-section p{


background:
var(--task-background);



border:

1px solid var(--task-border);



padding:15px;



border-radius:12px;


}







/******************************************************
 BUTTONS
******************************************************/


.task-actions{


display:flex;


justify-content:flex-end;



gap:10px;


margin-top:25px;


}





.task-actions button{


padding:

10px 18px;



border-radius:

10px;



border:none;



cursor:pointer;



font-weight:600;


}






.btn-primary{


background:
var(--task-primary);


color:white;


}





.btn-secondary{


background:

#e2e8f0;


color:

var(--task-text);


}







.btn-primary:hover,


.btn-secondary:hover{


opacity:.85;


}







/******************************************************
 MOBILE
******************************************************/


@media(max-width:700px){


.task-grid{


grid-template-columns:1fr;


}



.task-modal-content{


width:95%;


}



}


</style>
