<style>

/******************************************************
 * TASK VIEW UI SYSTEM V4
 *
 * Supports:
 * - Task modal
 * - Instructions
 * - Notes
 * - Evidence
 * - Progress updates
 * - Review workflow
 ******************************************************/



:root{


--task-primary:#800000;

--task-primary-hover:#660000;

--task-secondary:#64748b;

--task-background:#f8fafc;

--task-card:#ffffff;

--task-border:#e5e7eb;

--task-text:#111827;

--task-muted:#6b7280;


--success:#16a34a;

--warning:#d97706;

--danger:#dc2626;


--radius:16px;

--shadow:
0 20px 50px rgba(0,0,0,.15);


--font:
"Google Sans",
"Segoe UI",
Arial,
sans-serif;


}






/******************************************************
 MODAL OVERLAY
******************************************************/


.task-modal{


display:none;


position:fixed;


inset:0;


background:

rgba(15,23,42,.55);



justify-content:center;


align-items:center;



z-index:9999;


font-family:

var(--font);


}






/******************************************************
 MODAL CONTAINER
******************************************************/


.task-modal-content{


width:650px;


max-width:92%;



max-height:90vh;


overflow-y:auto;



background:white;



border-radius:

var(--radius);



padding:30px;



box-shadow:

var(--shadow);



}







/******************************************************
 HEADER
******************************************************/


.task-header{


display:flex;


justify-content:space-between;


align-items:flex-start;


margin-bottom:25px;


}




.task-header h2{


margin:0;


font-size:26px;


color:

var(--task-primary);


}




.task-meta{


margin-top:6px;


font-size:14px;


color:

var(--task-muted);


}








/******************************************************
 STATUS
******************************************************/


.status{


padding:

6px 14px;


border-radius:

999px;


font-size:12px;


font-weight:700;


}



.status-assigned{


background:#e0f2fe;


color:#0369a1;


}



.status-ongoing{


background:#fef3c7;


color:#92400e;


}



.status-review{


background:#ede9fe;


color:#6d28d9;


}



.status-completed{


background:#dcfce7;


color:#166534;


}



.status-archived{


background:#e5e7eb;


color:#374151;


}








/******************************************************
 FORM GROUP
******************************************************/


.form-group{


margin-bottom:18px;


}




.form-group label{


display:block;


font-size:13px;


font-weight:700;


margin-bottom:7px;


color:

var(--task-text);


}








/******************************************************
 INPUTS
******************************************************/


.form-control{


width:100%;


padding:

12px 14px;



border:

1px solid var(--task-border);



border-radius:

10px;



font-size:14px;



background:white;


font-family:

var(--font);


}



.form-control:focus{


outline:none;


border-color:

var(--task-primary);


}







textarea.form-control{


min-height:120px;


resize:vertical;


}








/******************************************************
 INSTRUCTIONS DISPLAY
******************************************************/


.task-description{


background:

#fff7ed;



border-left:

4px solid var(--task-primary);



padding:

15px;



border-radius:

10px;



font-size:14px;



line-height:1.5;


color:

var(--task-text);


}








/******************************************************
 INFO GRID
******************************************************/


.task-grid{


display:grid;


grid-template-columns:

repeat(2,1fr);



gap:15px;


margin-bottom:20px;


}




.task-card{


background:

var(--task-background);



border:

1px solid var(--task-border);



border-radius:

12px;



padding:15px;


}



.task-card label{


font-size:12px;


color:

var(--task-muted);


}



.task-card p{


margin:5px 0 0;


font-weight:600;


}








/******************************************************
 ACTION BUTTONS
******************************************************/


.task-actions{


display:flex;


justify-content:flex-end;


gap:10px;


margin-top:25px;


}




.task-actions button,


button{


padding:

11px 20px;



border-radius:

10px;



border:none;



cursor:pointer;



font-weight:600;


}



.btn-primary,


button{


background:

var(--task-primary);


color:white;


}




.btn-primary:hover,


button:hover{


background:

var(--task-primary-hover);


}







.btn-secondary{


background:#e5e7eb;


color:#111827;


}




.btn-danger{


background:

var(--danger);


color:white;


}








/******************************************************
 REVIEW SECTION
******************************************************/


.review-box{


background:#f9fafb;


border:

1px solid var(--task-border);



border-radius:12px;



padding:15px;


margin-top:20px;


}




.review-box h3{


margin-top:0;


font-size:16px;


}









/******************************************************
 MOBILE
******************************************************/


@media(max-width:700px){


.task-modal-content{


width:95%;


padding:20px;


}




.task-grid{


grid-template-columns:1fr;


}



}




</style>
