<script>

/******************************************************
 * CREATE TASK FORM V2
 *
 * Handles:
 * - Task creation
 * - Assignment
 * - Instructions
 * - New TASKS V2 schema
 ******************************************************/



window.openCreateTask = function(){



const title =

prompt(
"Task title:"
);



if(!title || title.trim()===""){


alert(
"Task title is required."
);


return;

}





const project =

prompt(
"Project / Event:"
)

|| "";







const department =

prompt(
"Department:"
)

|| "Technology";







const assignedTo =

prompt(
"Assign member ID:"
)

|| "";








const priority =

prompt(
"Priority (Low / Medium / High):"
)

|| "Medium";








const startDate =

prompt(
"Start date YYYY-MM-DD:"
)

|| "";








const deadline =

prompt(
"Deadline YYYY-MM-DD:"
);






if(!deadline){


alert(
"Deadline is required."
);


return;


}








const instructions =

prompt(
"Task instructions:"
)

|| "";








const task = {



title:title.trim(),



project:project.trim(),



department:department.trim(),



assignedTo:assignedTo.trim(),



priority:priority.trim(),



startDate:startDate.trim(),



deadline:deadline.trim(),



instructions:instructions.trim(),



notes:"",



evidence:""



};







console.log(

"CREATING TASK:",

task

);









apiCreateTask(



task,



function(response){





console.log(

"CREATE RESPONSE:",

response

);






if(!response){


alert(
"No server response."
);


return;


}







if(response.success){



alert(

"Task created successfully."

);






APP_LOADED=false;


loadApp();




}

else{



alert(

response.message ||

"Task creation failed."

);


}




},





function(error){



console.error(

"CREATE TASK ERROR:",

error

);




alert(

error.message ||

"Unable to create task."

);




}




);



};





</script>
