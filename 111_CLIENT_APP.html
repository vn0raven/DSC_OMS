<script>

/******************************************************
 * CLIENT APPLICATION SERVICE V3
 *
 * Handles:
 * - Application startup
 * - Global state
 * - User rendering
 * - Live data refresh
 ******************************************************/



let APP_DATA = null;



let APP_STATE = {

    user:null,

    dashboard:null,

    tasks:[],

    notifications:[]

};



let APP_LOADED = false;









/******************************************************
 * APPLICATION START
 ******************************************************/


function loadApp(){


if(APP_LOADED){


console.log(
"APP ALREADY LOADED"
);


return;


}




console.log(
"STARTING APPLICATION..."
);





showLoading();





apiGetAppData(



function(data){



console.log(
"APP DATA RESPONSE:",
data
);





if(!data){


showError(
"Empty server response."
);


hideLoading();


return;


}






if(!data.success){


showError(

data.message ||

"Application loading failed."

);


hideLoading();


return;


}







saveApplicationState(data);






renderApplication();






APP_LOADED=true;



hideLoading();





console.log(
"APPLICATION READY"
);




},





function(error){



console.error(

"APP LOAD ERROR:",

error

);




showError(

error.message ||

"Unable to load application."

);




hideLoading();




}



);





}












/******************************************************
 * SAVE GLOBAL STATE
 ******************************************************/


function saveApplicationState(data){



APP_DATA=data;




APP_STATE.user =

data.user;



APP_STATE.dashboard =

data.dashboard;



APP_STATE.tasks =

data.tasks || [];



APP_STATE.notifications =

data.notifications || [];




console.log(
"STATE UPDATED",
APP_STATE
);



}









/******************************************************
 * RENDER EVERYTHING
 ******************************************************/


function renderApplication(){



console.log(
"RENDER APPLICATION"
);





if(typeof renderUser === "function"){


renderUser(

APP_STATE.user

);


}







if(typeof renderDashboard === "function"){


renderDashboard(

APP_STATE.dashboard

);


}








if(typeof renderTasks === "function"){


renderTasks(

APP_STATE.tasks

);


}








if(typeof renderNotifications === "function"){


renderNotifications(

APP_STATE.notifications

);


}






}












/******************************************************
 * LIVE REFRESH
 *
 * Used after:
 * - Update task
 * - Complete task
 * - Create task
 ******************************************************/



function refreshApp(){



console.log(
"REFRESHING APPLICATION..."
);




showLoading();





apiGetAppData(





function(data){



console.log(
"REFRESH RESPONSE:",
data
);






if(!data || !data.success){


showError(
"Refresh failed."
);


hideLoading();


return;


}






saveApplicationState(data);





renderApplication();





hideLoading();






console.log(
"APPLICATION REFRESHED"
);




},





function(error){



console.error(
"REFRESH ERROR:",
error
);




showError(

error.message ||

"Unable to refresh."

);




hideLoading();



}





);



}














/******************************************************
 * USER RENDERING
 ******************************************************/


function renderUser(user){



if(!user){


console.warn(
"No user data."
);


return;


}







setText(

"userName",

user.name

);








setText(

"userInfo",

`${user.position || ""}
| ${user.role || ""}
• ${user.department || ""}`

);








setText(

"userRole",

user.role

);







const button =

document.getElementById(

"createTaskBtn"

);






if(button){



button.style.display =




[

"Lead",

"Co-Lead",

"Executive"

]

.includes(

user.role

)



?

"block"



:

"none";



}





}







</script>
