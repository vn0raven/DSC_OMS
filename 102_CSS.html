<style>

*{
box-sizing:border-box;
font-family:"Google Sans","Segoe UI",Arial,sans-serif;
}


body{
margin:0;
background:#f5f7fb;
color:#202124;
}


/* LOADING */

#loadingScreen{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:white;

display:flex;

align-items:center;
justify-content:center;

font-size:20px;

font-weight:600;

color:#2563eb;

z-index:9999;

}



/* APP */

.app-container{

display:flex;

min-height:100vh;

}



/* SIDEBAR */

.sidebar{

width:250px;

background:#0f172a;

color:white;

padding:25px 15px;

position:fixed;

height:100vh;

left:0;

top:0;

}



.logo{

font-size:22px;

font-weight:700;

padding:0 15px 30px;

}


.logo span{

font-size:14px;

font-weight:400;

color:#cbd5e1;

}



.sidebar nav{

display:flex;

flex-direction:column;

gap:8px;

}



.nav-item{

padding:12px 15px;

border-radius:10px;

color:#cbd5e1;

cursor:pointer;

transition:.2s;

text-decoration:none;

}



.nav-item:hover{

background:#1e293b;

color:white;

}



.nav-item.active{

background:#2563eb;

color:white;

}



/* MAIN */

.main{

margin-left:250px;

width:calc(100% - 250px);

padding:25px 35px;

}



/* HEADER */

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

background:white;

padding:20px 25px;

border-radius:16px;

box-shadow:0 2px 8px rgba(0,0,0,.05);

margin-bottom:25px;

}



.topbar h2{

margin:0;

font-size:24px;

}



.topbar p{

margin:8px 0 0;

color:#64748b;

font-size:14px;

}



/* CARDS */

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:25px;

}



.card{

background:white;

padding:20px;

border-radius:16px;

box-shadow:0 2px 8px rgba(0,0,0,.05);

}



.card h4{

margin:0;

color:#64748b;

}



.card h1{

margin:15px 0 0;

font-size:32px;

color:#2563eb;

}



/* PANEL */

.panel{

background:white;

border-radius:16px;

padding:20px;

margin-bottom:25px;

box-shadow:0 2px 8px rgba(0,0,0,.05);

}



.panel-header{

display:flex;

justify-content:space-between;

align-items:center;

}



/* BUTTON */

button{

background:#2563eb;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

}



/* TABLE */

table{

width:100%;

border-collapse:collapse;

}



th{

text-align:left;

padding:14px;

background:#f8fafc;

}



td{

padding:14px;

border-top:1px solid #e5e7eb;

}



/* STATUS */

.status{

padding:5px 12px;

border-radius:20px;

font-size:12px;

font-weight:600;

}


.pending{

background:#fef3c7;

}


.ongoing{

background:#dbeafe;

}


.completed{

background:#dcfce7;

}



/* NOTIFICATION */

.notification{

padding:12px;

border-bottom:1px solid #e5e7eb;

}



/* MOBILE */

@media(max-width:900px){


.sidebar{

width:80px;

}


.main{

margin-left:80px;

width:calc(100% - 80px);

}


.cards{

grid-template-columns:repeat(2,1fr);

}

}



@media(max-width:600px){


.sidebar{

bottom:0;

top:auto;

width:100%;

height:70px;

}


.main{

margin-left:0;

width:100%;

}



.cards{

grid-template-columns:1fr;

}

}


</style>
