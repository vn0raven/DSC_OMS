<style>

/* ======================================
   DSC USeP OMT UI SYSTEM V2
   Modern SaaS + University Style
====================================== */


/* ==========================
   DESIGN TOKENS
========================== */

:root{

--dsc-maroon:#800000;

--dsc-red:#b91c1c;

--primary:#800000;

--primary-hover:#660000;

--navy:#111827;

--background:#f7f7f5;

--surface:#ffffff;

--text:#111111;

--muted:#6b7280;

--border:#e5e7eb;

--success:#16a34a;

--warning:#d97706;

--danger:#dc2626;

--shadow:
0 4px 16px rgba(0,0,0,.06);

--radius:16px;

}



/* ==========================
   GLOBAL
========================== */


*{

box-sizing:border-box;

font-family:
"Google Sans",
"Segoe UI",
Arial,
sans-serif;

}



body{

margin:0;

background:
var(--background);

color:
var(--text);

}



/* ==========================
   LOADING
========================== */


#loadingScreen{

position:fixed;

inset:0;

background:white;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:600;

color:var(--primary);

z-index:9999;

}





/* ==========================
   APP STRUCTURE
========================== */


.app-container{

display:flex;

min-height:100vh;

}





/* ==========================
   SIDEBAR
========================== */


.sidebar{

width:260px;

background:
linear-gradient(
180deg,
#111827,
#3b0a0a
);

color:white;

padding:25px 15px;

position:fixed;

height:100vh;

left:0;

top:0;

}



.logo{

font-size:24px;

font-weight:800;

padding:

0 15px 35px;

}



.logo span{

font-size:13px;

color:#d1d5db;

font-weight:400;

}



.sidebar nav{

display:flex;

flex-direction:column;

gap:6px;

}



.nav-item{

padding:13px 15px;

border-radius:12px;

color:#d1d5db;

cursor:pointer;

transition:.2s;

text-decoration:none;

font-size:15px;

}



.nav-item:hover{

background:
rgba(255,255,255,.1);

color:white;

}



.nav-item.active{

background:
var(--dsc-maroon);

color:white;

font-weight:600;

}





/* ==========================
   MAIN
========================== */


.main{

margin-left:260px;

width:
calc(100% - 260px);

padding:30px;

}





/* ==========================
   HEADER
========================== */


.topbar{

display:flex;

justify-content:space-between;

align-items:center;

background:white;

padding:25px 30px;

border-radius:var(--radius);

box-shadow:var(--shadow);

margin-bottom:25px;

}



.topbar h2{

margin:0;

font-size:26px;

}



.topbar p{

margin-top:8px;

color:var(--muted);

font-size:14px;

}





/* ==========================
   STAT CARDS
========================== */


.cards{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-bottom:25px;

}



.card{

background:white;

padding:25px;

border-radius:var(--radius);

box-shadow:var(--shadow);

border:
1px solid var(--border);

}



.card h4{

margin:0;

font-size:14px;

color:var(--muted);

}



.card h1{

margin-top:15px;

font-size:36px;

color:var(--primary);

}





/* ==========================
   PANELS
========================== */


.panel{

background:white;

padding:25px;

border-radius:var(--radius);

box-shadow:var(--shadow);

border:
1px solid var(--border);

margin-bottom:25px;

}



.panel-header{

display:flex;

justify-content:space-between;

align-items:center;

}





/* ==========================
   BUTTONS
========================== */


button{

background:
var(--primary);

color:white;

border:none;

padding:11px 20px;

border-radius:10px;

font-weight:600;

cursor:pointer;

transition:.2s;

}



button:hover{

background:
var(--primary-hover);

}





/* ==========================
   TABLE
========================== */


table{

width:100%;

border-collapse:collapse;

}



thead{

background:#fafafa;

}



th{

text-align:left;

padding:15px;

font-size:13px;

color:var(--muted);

}



td{

padding:15px;

border-top:
1px solid var(--border);

font-size:14px;

}



tr:hover{

background:#fafafa;

}





/* ==========================
   STATUS BADGES
========================== */


.status{

padding:5px 12px;

border-radius:999px;

font-size:12px;

font-weight:600;

}



.pending{

background:#fef3c7;

color:#92400e;

}



.ongoing{

background:#dbeafe;

color:#1d4ed8;

}



.completed{

background:#dcfce7;

color:#166534;

}





/* ==========================
   PRIORITY BADGES
========================== */


.priority{

padding:5px 12px;

border-radius:999px;

font-size:12px;

font-weight:700;

display:inline-block;

}



.priority.high{

background:#fee2e2;

color:#991b1b;

}



.priority.medium{

background:#fef3c7;

color:#92400e;

}



.priority.low{

background:#dcfce7;

color:#166534;

}





/* ==========================
   PROGRESS BAR
========================== */


.progress{

height:8px;

background:#e5e7eb;

border-radius:999px;

overflow:hidden;

}



.progress-bar{

height:100%;

background:
var(--primary);

}





/* ==========================
   TASK TITLE
========================== */


.task-title{

font-weight:700;

margin-bottom:5px;

}



.task-title small{

font-size:12px;

color:var(--muted);

}





/* ==========================
   VIEW BUTTON
========================== */


.view-btn{

background:

var(--dsc-maroon);

padding:

8px 16px;

font-size:13px;

}



.view-btn:hover{

background:

var(--primary-hover);

}





/* ==========================
   NOTIFICATIONS
========================== */


.notification{

padding:15px;

border-bottom:

1px solid var(--border);

}





/* ==========================
   TASK MODAL
========================== */


.task-modal{

display:none;

position:fixed;

inset:0;

background:

rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:5000;

}



.task-modal-content{

background:white;

width:550px;

max-width:90%;

padding:30px;

border-radius:20px;

box-shadow:

0 20px 60px rgba(0,0,0,.25);

}





/* ==========================
   FORM ELEMENTS
========================== */


.form-group{

margin-bottom:18px;

}



.form-group label{

display:block;

font-size:13px;

font-weight:600;

margin-bottom:6px;

color:var(--muted);

}



.form-control{

width:100%;

padding:12px 14px;

border:

1px solid var(--border);

border-radius:10px;

font-size:14px;

outline:none;

}



.form-control:focus{

border-color:

var(--dsc-maroon);

}



textarea.form-control{

resize:none;

min-height:100px;

}





/* ==========================
   TASK DETAIL HEADER
========================== */


.task-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}



.task-meta{

color:var(--muted);

font-size:14px;

}





/* ==========================
   AVATAR
========================== */


.avatar{

width:38px;

height:38px;

border-radius:50%;

background:

var(--dsc-maroon);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-weight:700;

}





/* ==========================
   EMPTY STATE
========================== */


.empty-state{

padding:40px;

text-align:center;

color:var(--muted);

font-size:14px;

}





/* ==========================
   RESPONSIVE
========================== */


@media(max-width:900px){


.sidebar{

width:80px;

}


.main{

margin-left:80px;

width:
calc(100% - 80px);

}



.cards{

grid-template-columns:
repeat(2,1fr);

}


table{

display:block;

overflow-x:auto;

white-space:nowrap;

}


}




@media(max-width:600px){


.sidebar{

position:fixed;

bottom:0;

top:auto;

width:100%;

height:70px;

}



.main{

margin-left:0;

width:100%;

padding-bottom:90px;

}



.cards{

grid-template-columns:1fr;

}


}



</style>
